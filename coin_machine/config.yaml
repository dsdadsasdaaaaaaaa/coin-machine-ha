# Home Assistant add-on manifest for Coin Machine.
# Reference: https://developers.home-assistant.io/docs/add-ons/configuration
# `version` must equal package.json's version: the Supervisor pulls `<image>:<version>`,
# and the release workflow (.github/workflows/addon-image.yml) refuses a tag that disagrees.
name: Coin Machine
version: "0.11.0"
slug: coin_machine
description: AI deal analyst for coin flippers, collectors and dealers. Runs your hunts on a schedule and sends new BUY deals to your phone.
url: https://github.com/dsdadsasdaaaaaaaa/coin-machine-ha
arch:
  - aarch64
  - amd64
image: ghcr.io/dsdadsasdaaaaaaaa/coin-machine-{arch}
startup: application
boot: auto
# The image runs its own init (tini) as PID 1.
init: false
# Opens inside Home Assistant (the sidebar, "Open web UI", and the remote address): Home Assistant signs the
# user in and forwards to this port, which answers only the Supervisor. The app's own port stays available on
# the home network, behind the access password. With the `accounts` option on, everyone signs in at one address
# instead, and this port answers with a link to it.
ingress: true
ingress_port: 8099
# The app lives at <ingress path>/app, not at the ingress root. Home Assistant only routes addresses that have
# something after the ingress token's slash, and the app's own home address has no trailing slash.
ingress_entry: app
# Uploads and long answers pass through without being buffered.
ingress_stream: true
panel_icon: mdi:hand-coin
panel_title: Coin Machine
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: Coin Machine on your home network (asks for the access password)
# Asked at the app's own port, so the check never depends on the ingress port being up. The app sends this
# bare address on to its full one (under the ingress path); the Supervisor follows that and reads the answer.
watchdog: "http://[HOST]:[PORT:3000]/api/health"
# Lets the app send phone notifications and publish sensor.coin_machine_* states.
homeassistant_api: true
# The add-on is stopped while Home Assistant copies /data, so the SQLite
# database is never copied half-written.
backup: cold
options:
  access_password: ""
  anthropic_api_key: ""
  ebay_client_id: ""
  ebay_client_secret: ""
  ebay_environment: production
  pcgs_api_token: ""
  numista_api_key: ""
  notify_service: ""
  publish_sensors: true
  accounts: false
  share_keys: false
  # The people this is built for buy in Canada. An install that never set the option gets this on update.
  currency: CAD
schema:
  access_password: password?
  anthropic_api_key: password?
  ebay_client_id: str?
  ebay_client_secret: password?
  ebay_environment: list(production|sandbox)
  pcgs_api_token: password?
  numista_api_key: password?
  notify_service: str?
  publish_sensors: bool
  accounts: bool
  share_keys: bool
  frame_ancestors: str?
  public_url: url?
  currency: list(USD|CAD)?
  timezone: str?
